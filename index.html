<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Case of the Beautiful Gate — Sound Board</title>
<style>
  :root{
    --bg:#101214; --panel:#171a1e; --panel2:#1e2227; --line:#2a2f36;
    --ink:#e9e6df; --mute:#9a9ea6; --dim:#6b7078;
    --amber:#f2b33d; --green:#3ecf8e; --red:#ff5d5d; --blue:#6aa8ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button{font:inherit;color:inherit;cursor:pointer}
  header{position:sticky;top:0;z-index:20;background:#0c0e10;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
  h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px;white-space:nowrap}
  h1 small{display:block;font-weight:400;color:var(--mute);font-size:12px}
  .sbbox{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 260px}
  .sbbox .lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--amber)}
  .sbbox .what{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .go{background:var(--green);color:#06150e;border:0;border-radius:10px;padding:10px 22px;font-weight:800;font-size:17px;letter-spacing:1px}
  .go:active{transform:scale(.97)}
  .btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px}
  .btn:hover{border-color:#3a414a}
  .btn.red{border-color:#5a2a2a;color:#ffb3b3}
  .vol{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
  input[type=range]{accent-color:var(--amber);width:100px}
  .keys{font-size:11.5px;color:var(--dim);width:100%}
  .keys kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font:11px ui-monospace,monospace;color:var(--mute)}
  #now{display:flex;gap:6px;flex-wrap:wrap;padding:6px 16px;min-height:36px;border-bottom:1px solid var(--line);background:#0e1012;align-items:center;position:sticky;top:var(--hdr,96px);z-index:19}
  #now .empty{color:var(--dim);font-size:12px}
  .chip{display:flex;align-items:center;gap:6px;background:#12251c;border:1px solid #23533c;border-radius:999px;padding:2px 4px 2px 10px;font-size:12.5px}
  .chip .t{color:var(--mute);font-variant-numeric:tabular-nums}
  .chip button{border:0;background:#1b3a2b;border-radius:999px;padding:1px 8px;font-size:11.5px}
  main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,1fr);gap:0;height:calc(100vh - var(--hdr,96px) - var(--nowh,37px))}
  #script{overflow-y:auto;padding:18px 28px 60vh;border-right:1px solid var(--line)}
  #board{overflow-y:auto;padding:12px 14px 40vh;background:#0d0f11}
  .sc-title{font-size:20px;font-weight:700;margin:4px 0 2px}
  .sc-sub{color:var(--mute);margin:0 0 18px;font-size:13px}
  .act{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--amber);margin:30px 0 10px;padding-top:10px;border-top:1px solid var(--line)}
  .stage{color:var(--mute);font-style:italic;margin:10px 0}
  .line{margin:10px 0}
  .who{font-weight:700;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:#cfc7b5;margin-right:6px}
  .cue-chip{display:inline-flex;align-items:center;gap:5px;vertical-align:baseline;margin:0 3px;padding:1px 8px 1px 6px;border-radius:6px;border:1px solid #3d4550;background:#1f252c;font-size:12px;font-style:normal;font-weight:600;color:#cfd6df;line-height:1.6}
  .cue-chip .n{font-variant-numeric:tabular-nums;color:var(--blue)}
  .cue-chip:hover{border-color:var(--blue)}
  .cue-chip.big{border-color:#6a3434;background:#2a1717}
  .cue-chip.big .n{color:var(--red)}
  .cue-chip.standby{outline:2px solid var(--amber);outline-offset:1px}
  .cue-chip.playing{background:#143826;border-color:var(--green);color:#dfffee}
  .cue-chip.playing .n{color:var(--green)}
  .grp{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute);margin:16px 2px 8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .tile.big{border-color:#5a2c2c}
  .tile.standby{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
  .tile.playing{border-color:var(--green);background:#11251b}
  .tile.drag{border-color:var(--blue);background:#14202e}
  .tplay{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 30px 6px 10px;min-height:60px}
  .tplay .num{font:600 12px ui-monospace,monospace;color:var(--blue)}
  .tile.big .num{color:var(--red)}
  .tile.playing .num{color:var(--green)}
  .tplay .nm{display:block;font-weight:600;font-size:13.5px;line-height:1.25;margin-top:2px}
  .tplay .meta{display:block;font-size:11px;color:var(--dim);margin-top:3px}
  .tplay .meta .file{color:var(--amber)}
  .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--green);width:0}
  .tmore{position:absolute;top:5px;right:4px;border:0;background:none;color:var(--dim);font-size:16px;padding:0 6px;line-height:1.2}
  .tmore:hover{color:var(--ink)}
  .tset{padding:0 10px 10px;font-size:12px;color:var(--mute);border-top:1px solid var(--line);display:none}
  .tile.open .tset{display:block}
  .tset .row{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
  .tset .tip{margin-top:8px;color:#b9b4a8}
  .tvol{display:flex;align-items:center;gap:6px;padding:0 10px 9px}
  .tvol input[type=range]{flex:1;width:auto;min-width:0;height:16px}
  .vv{font:11px ui-monospace,monospace;color:var(--mute);min-width:34px;text-align:right;cursor:pointer}
  .vv.off{color:var(--amber)}
  .chip input[type=range]{width:80px;height:14px}
  .vol .vv{min-width:38px;font-size:12px}
  .tset .btn{padding:3px 8px;font-size:11.5px}
  .boardnote{font-size:12px;color:var(--dim);margin:6px 2px 2px;line-height:1.45}
  #viewtoggle{display:none}
  @media (max-width:900px){
    main{grid-template-columns:1fr}
    #script{border-right:0;padding:16px 16px 50vh}
    body.show-board #script{display:none}
    body:not(.show-board) #board{display:none}
    #viewtoggle{display:inline-block}
    .keys{display:none}
  }
</style>
</head>

<header id="hdr">
  <h1>The Case of the Beautiful Gate<small>Sound board · CAYS retreat skit</small></h1>
  <div class="sbbox"><span class="lbl">Standby</span><span class="what" id="sbWhat">—</span></div>

  <div class="keys"><kbd>Space</kbd> GO &nbsp; <kbd>↑</kbd><kbd>↓</kbd> move standby &nbsp; <kbd>Esc</kbd> fade all &nbsp; <kbd>Shift</kbd>+<kbd>Esc</kbd> stop now &nbsp; <kbd>-</kbd><kbd>=</kbd> master volume &nbsp;·&nbsp; Double-click any % to reset it · Click a playing cue to stop it · Drag an audio file onto any tile to replace its sound</div>
</header>
<div id="now"><span class="empty">Nothing playing</span></div>
<main>
  <section id="script"></section>
  <aside id="board"></aside>
</main>
<input type="file" id="filepick" accept="audio/*" hidden>

 {id:'18',act:1,name:'Flashback harp ◂ out',syn:'flashOut',stops:'all',then:[['01',1.8]],rev:.6,tip:'The harp reversed. Fades out the scene, then the noir theme (01) comes back by itself.'},

const ENABLED=['01','03','05','06','07','18','19','22','22b','38'];

/* =========================================================
   SCRIPT — {{id}} marks where a cue fires
   ========================================================= */
const SCRIPT=`
## ACT 1 — Intro and Pentecost
[Luke walks towards his desk and taps at a piece of evidence that is troubling him: a photo of the place where the lame man used to be placed every day.] {{01}}
PI: This doesn't make sense, how is it possible that a man who was lame (TO AUDIENCE: meaning he couldn't walk, right, not that he was uncool or something), is now able to walk? All the evidence is pointing to supernatural reasons, but why would this happen, why now?
[Theophilus comes in accompanied by Witness 1, one of those that now believes (Nalani)] {{03}}
Theophilus: I have found the witness who claims to know some people involved in the incident.
PI: Yes, please come in, sorry my mind and my desk are both scattered right now, hopefully you can clarify things for me a little bit.
Witness 1: Yes, thank you, I don't know if I can clarify things, but I can let you know what I have seen.
PI: I would invite you to take a seat, but I think this mystery is too mysterious for us to chill at any moment.
Witness 1: I understand, standing completely OK.
[Theophilus kind of nods and walks away, ready to become an extra for the scene unfolding next to them next.]
PI: Let us get this quick, the hearing before the court of powerful elites is gonna happen in a couple of hours.
Witness 1: I was not there for the main case in question, but I do think there's something that happened not too long before which is important to what happened with that lame guy.
PI: [rubs his mustache and nods his head dramatically] Anything bro, anything that would help us get any clarity to this miraculous act.
[Now, as the Witness describes what is going on, the scene plays out next to them. People come in from the side and take their positions.] {{05}}
Witness 1: It was the day of Pentecost, and there were a lot of people, some people came from a couple blocks away, other people travelled from all the way in Asia, all were hoping to celebrate this special festival. And the twelve disciples of Jesus were there, including Peter and John.
[Next to them, as if on a different stage, the Apostles (Peter, John, and another one) gather together sitting on the ground, and other people are around talking to each other.]
Witness 1: And we were everybody minding our own business, kind of, celebrating and praying, and then all of a sudden like a massive hurricane comes in, {{07}} it kind of gave me tinnitus. {{06}}
[At "a massive hurricane comes in", a huge sound comes in, and then the Holy Spirit (Quinton) descends.]
Witness 1: And then there was like a fire that fell upon them [Quinton throws orange/yellow confetti on the disciple characters], and then these guys started speaking in a language I could understand?
[The disciples get up from sitting down and start speaking actual languages, of the marvels that God has done. Everybody around looks at them confused.]
Guy 1: Why are there drunk people here? Have they not read Proverbs 31? They filled with the sweet wine bro.
Guy 2: No, but they are speaking actual languages, I got a bit of Mexican and Chinese from their words, which, as you would understand, doesn't make sense. They are neither Chinese or Mexican.
[The PI and the Witness walk into the scene, as if they were walking into a museum, looking around. They are not perceived by everyone else.]
PI: So they, just started speaking random languages, fluently, without an accent?
Witness 1: Yeah, quite gnarly I think.
PI: Wait what, that is equally as unbelievable as the lame man story.
Witness 1: I know, I thought so too, but then Peter, one of the twelve disciple guys, explained on their behalf.
[Peter (Melvin) walks forward, and speaks to the people, and also, in a way, to the audience.]
Peter: Everyone, we are not drunk; it's too early for any drinking! But you guys know, the homie, the prophet Joel, he said that God said: "I will pour forth of My Spirit on all mankind" and "I will grant wonder in the sky above and signs in the earth below," "And it shall be that everyone who calls on the name of the Lord will be saved".
[The other disciples back him up: "Preach", "Facts", "Uh huh"]
Peter: But this man– Jesus, this man performed many miracles that proved who He was, He was sent by God and His plan, and you guys crucified Him. You literally killed Him. But He rose up again, David said in His Psalms: "Because You will not abandon my soul to Hades, nor allow Your Holy One to undergo decay." We know that David is dead, so he was not talking about himself, but he spoke of Jesus, who rose from the dead, and to whose rising up we are all witnesses. He caused all this to happen, which you are seeing and hearing– so you guys can know, all you in Israel, that God made Him both Lord and Christ– this Jesus whom you crucified.
[There is a commotion and everyone looks worried]
Guy 2: [In agony and worry] What do we do, then? Are we cooked with the sauce?
Peter: Repent, and be baptized because of your forgiveness.
Witness 1: And everyone who believed, started serving one another, we ate together like every day, and the apostles continued to show great signs, I haven't gotten to see all of them though.
[Everyone except Witness 1 and the PI exit the scene] {{18}}

## ACT 2 — Healing of the Lame Man
PI: Wait, hold on, hold on, there was a lot in all of that. [The PI leans onto his table with most of his weight, thinking out loud] So there's a Jesus, who gives powers? And not only that He is able to forgive sins?
Witness 1: Yes, the Spirit of God gave them the power to speak tongues, and through it they have performed many miracles, which would include the healing at the Beautiful Gate.
PI: But why would God give people the power to speak in tongues, like within this week? What is this all about, what is the motive?
[As the PI is confused, Theophilus comes in with another witness (Gianna), who will testify on the healing of the Lame Man.] {{19}}
Theophilus: We got an actual witness for the healing incident.
PI: Ok, alright yeah let's hear her out, what happened, did you hear anyone speaking Chinese?
Witness 2: What? Uh, I don't remember, I don't think so? What happened was as I was walking home, I passed by the Beautiful Gate, because it's sort of on the way, if you don't detour too much from the traffic of crowds, it saves you like 3 minutes and...
PI: Lock-in bro. We don't have too much time this skit has to be 10 minutes.
[As the Witness describes this next scene, that scene unfolds right next to them, but now there is a lame guy on the floor.] {{22}}
Witness 2: Ohh yeah, sorry. So, at the gate there was a lame man, always see him there, but then there were two men, who I hadn't seen before, and they approached the gate man, and he was like "can you give me some money, some gold," but then they replied...
Peter: Look at us! [Peter (Melvin) flexes his nonexistent muscles]
Lame: [Looks at them for a bit, then signals to his hand, expecting them to drop some cash]
Peter: Nonono, I actually have no gold, but I can do you something better. [He reaches down to the lame man and takes his hand] In the Name of Jesus Christ of Nazareth– walk!
[The Lame man exerts effort and gets up on his two legs. He stands still for a few seconds, looking down at his legs.]
Lame: Woah.
[The Lame man shakes his legs, does a little lap around Peter and John.]
Lame: Okokok, OK! WHAT? Praise God! How, Huh??
PI: He just lifted him up, and he got up? and he walked? There seems to be power in this name, the one of Jesus. By it all these things are happening.
Witness 2: Yeah, I think you are getting it. In fact, Peter went on a long sermon about it like right after. In fact, the Sadducees, priests, and temple guards were there.
[The host of religious leaders and the Temple Guard show up.]
Peter: You guys think this was by our own power. But nah, the power that healed Him was Jesus, whom, last time I checked, you guys crucified, and asked instead for a murderer to be given back to you. But God raised this Prince of life from the dead, and in the name of Jesus this man who I am sure you guys know was strengthened to walk again. So PLEASE, repent and return, so that your sins may be wiped away, in order that times of refreshing may come from the presence of the Lord.
[The PI rubs his forehead and walks back to his table, looking a bit confused and stressed.]
PI: Wait, why would God give someone such a powerful name, and moreso grant power to fishermen, power to do things which are so epic.
[Everyone on stage is looking at him, as he is looking away. After a few seconds, he turns around and looks at everyone.]
PI: I need to think, I need to pray, everyone, get out of here. Out, please, get out! {{18}} [Everyone, including the scene actors, exit right.]

## ACT 3 — Before the Religious Leaders (in progress)
Witness 1: Let's wait for him to finish praying, I think all of this is weighing heavy on him.
Witness 2: There is something else I need to tell him, this final part reveals how the Lord was glorified in the proclamation of His Word.
PI: Okay, the Lord answered my distress. Understanding what Peter has said, it was all according to prophecy, these men are truly from God. So tell me, what happened to them, if they are from God who found any fault in them?
Witness 2: There is one last incident that happened with Peter and John. After Peter preached the Word of the Lord, the crime bosses in the town were not happy about it. It challenged their schemes for honor and fame amidst the crowds. And they would let nothing get in their way.
Caiaphas and the Sanhedrin: (Jared in Ogre costume) Well, well, well! If it isn't the two insignificant tiny pebbles stuck in the bottom of my ogre shoes. (all the Sanhedrin shout) Peter and John!
Ogre Sanhedrin: Tell me, why are you attempting once again to dissuade the crowds?! Their honor belongs to us! [Caiaphas and Jared seize Peter and John, laying hands on them zealously]
Crowds: We know that these men were from God! They were untrained and unlearned, but they spoke clearly about Christ! We believe in their words! We will not follow the crime bosses but only the words of these men. These men proclaim the Lord's Word.
[Transition to court scene] {{38}}

/* =========================================================

let ctx, master, comp, reverb, NOISE=null, OFFLINE=false;
function buildGraph(c){
  ctx=c;
  comp=ctx.createDynamicsCompressor(); comp.threshold.value=-12; comp.ratio.value=4; comp.attack.value=.005; comp.release.value=.2;
  master=ctx.createGain(); master.gain.value=settings.master;
  master.connect(comp); comp.connect(ctx.destination);
  reverb=ctx.createConvolver(); reverb.buffer=makeIR(2.6);
  reverb.connect(master);
  NOISE=null;
}
function initAudio(){
  if(ctx) return;
  buildGraph(new (window.AudioContext||window.webkitAudioContext)());
}
function makeIR(sec){
  const r=ctx.sampleRate, len=Math.floor(r*sec), b=ctx.createBuffer(2,len,r);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)*.6;}
  return b;
}
const m2f=m=>440*Math.pow(2,(m-69)/12);
function noiseBuf(){
  if(NOISE) return NOISE;
  const len=ctx.sampleRate*3, b=ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  return NOISE=b;
}
const G=(v=1)=>{const g=ctx.createGain(); g.gain.value=v; return g;};
function F(type,f,q=1,t){const b=ctx.createBiquadFilter(); b.type=type; b.frequency.value=f; b.Q.value=q; if(t!=null) b.frequency.setValueAtTime(f,t); return b;}
function chain(...n){for(let i=0;i<n.length-1;i++) n[i].connect(n[i+1]); return n[n.length-1];}
function perc(g,t,a,d,peak){g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+d);}
function ahr(g,t,a,h,r,peak){g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.setValueAtTime(peak,t+a+h); g.gain.linearRampToValueAtTime(0,t+a+h+r);}
function O(type,f,t,end,det=0){const o=ctx.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t); o.detune.setValueAtTime(det,t); o.start(t); if(end!=null) o.stop(end); return o;}
function noise(v,t,dur){const s=ctx.createBufferSource(); s.buffer=noiseBuf(); s.loop=true; s.start(t,Math.random()*2); if(dur!=null) s.stop(t+dur); else v.keep(s); return s;}
function nb(v,t,{type='bandpass',f=1000,q=1,a=.002,d=.1,peak=.5,dest}={}){
  const n=noise(v,t,a+d+.05), fl=F(type,f,q), g=G(0); perc(g,t,a,d,peak); chain(n,fl,g,dest||v.out);
}
function seq(v,step,fn,t){
  let i=0,next=t;
  const tick=()=>{
    const horizon=OFFLINE? ctx.length/ctx.sampleRate : ctx.currentTime+.15;
    while(next<horizon){fn(i,next); i++; next+= typeof step==='function'? step(i): step;}
  };
  tick(); if(!OFFLINE) v.timer(setInterval(tick,40));
}
function every(v,ms,fn){ if(!OFFLINE) v.timer(setInterval(fn,ms)); }

/* --- instruments --- */
function piano(v,m,t,dur=1.5,vel=.3){
  const g=G(0); perc(g,t,.005,dur,vel);
  const lp=F('lowpass',2600,.5), o1=O('triangle',m2f(m),t,t+dur+.1), o2=O('sine',m2f(m)*2,t,t+dur+.1), g2=G(.25);
  o1.connect(lp); o2.connect(g2).connect(lp); lp.connect(g).connect(v.out);
}
function organ(v,m,t,dur,vel){
  const g=G(0); ahr(g,t,.01,dur,.12,vel);
  const lfo=O('sine',6.2,t,t+dur+.2), lg=G(6); lfo.connect(lg);
  [[1,1],[2,.7],[3,.45],[4,.35],[6,.18],[8,.15]].forEach(([h,a])=>{const o=O('sine',m2f(m)*h,t,t+dur+.2); lg.connect(o.detune); o.connect(G(a/3.2)).connect(g);});
  g.connect(v.out);
}
function brass(v,m,t,dur,vel=.25){
  const g=G(0); ahr(g,t,.03,dur,.15,vel);
  const lp=F('lowpass',300,2,t); lp.frequency.linearRampToValueAtTime(2600,t+.06); lp.frequency.exponentialRampToValueAtTime(1300,t+.4);
  [-7,7].forEach(d=>O('sawtooth',m2f(m),t,t+dur+.3,d).connect(lp)); lp.connect(g).connect(v.out);
}
function pad(v,m,t,dur,vel=.08,{a=1.2,r=1.5,type='sawtooth',cut=1400}={}){
  const g=G(0); ahr(g,t,a,Math.max(0,dur-a),r,vel); const lp=F('lowpass',cut,.7);
  [-9,0,9].forEach(d=>O(type,m2f(m),t,t+dur+r+.1,d).connect(lp)); lp.connect(g).connect(v.out);
}
function choir(v,m,t,dur,vel=.4,{a=.8,r=1.6}={}){
  const g=G(0); ahr(g,t,a,Math.max(0,dur-a),r,vel); const mix=G(1);
  const lfo=O('sine',5,t,t+dur+r+.2), lg=G(12); lfo.connect(lg);

  mix.connect(F('bandpass',750,5)).connect(g); mix.connect(F('bandpass',1150,6)).connect(g); mix.connect(F('bandpass',2600,8)).connect(G(.4)).connect(g);
  g.connect(v.out);
}
function bell(v,m,t,vel=.2,dec=2.5){
  [[1,1,1],[2.756,.5,.6],[5.404,.25,.4],[8.933,.12,.25]].forEach(([r,a,dd])=>{if(m2f(m)*r>18000) return; const o=O('sine',m2f(m)*r,t,t+dec*dd+.1), g=G(0); perc(g,t,.002,dec*dd,vel*a); o.connect(g).connect(v.out);});

function timp(v,t,f=60,vel=.8,dec=1.4){
  const o=O('sine',f*1.6,t,t+dec+.1); o.frequency.exponentialRampToValueAtTime(f,t+.08);

function kick(v,t,vel=.6){const o=O('sine',150,t,t+.4); o.frequency.exponentialRampToValueAtTime(45,t+.12); const g=G(0); perc(g,t,.002,.3,vel); o.connect(g).connect(v.out);}
function clap(v,t){[0,.012,.024].forEach(d=>nb(v,t+d,{f:1400,q:1.2,d:.05,peak:.4})); nb(v,t+.03,{f:1400,q:1,d:.15,peak:.25});}
function bass(v,m,t,dur,vel){
  const o=O('triangle',m2f(m),t,t+dur+.1), o2=O('sawtooth',m2f(m),t,t+dur+.1), lp=F('lowpass',650,1), g=G(0); perc(g,t,.005,dur,vel);

function sax(v,m,t,dur,vel){
  const o=O('sawtooth',m2f(m),t,t+dur+.3); o.detune.setValueAtTime(-60,t); o.detune.linearRampToValueAtTime(0,t+.08);
  const l=O('sine',5,t,t+dur+.3), lg=G(0); lg.gain.setValueAtTime(0,t); lg.gain.linearRampToValueAtTime(14,t+Math.min(dur,.6)); l.connect(lg).connect(o.detune);

function trombone(v,m,t,dur,vel,vib){
  const o=O('sawtooth',m2f(m),t,t+dur+.2);

function babble(v,t,{level=1,layers=6,rlo=.3,rhi=1.5,flo=300,fhi=1400,q=3}={}){

function bird(v,t){

function distCurve(k){const n=1024,c=new Float32Array(n); for(let i=0;i<n;i++){const x=i*2/n-1; c[i]=(1+k)*x/(1+k*Math.abs(x));} return c;}

  seq(v,sec,(s,tt)=>{

  },t);

    nb(v,t,{type:'highpass',f:5000,a:.01,d:2.5,peak:.25}); [62,66,69].forEach(m=>brass(v,m,t,.9,.15)); return 5;
  },
  victory(v,t){
    const e=60/128/2, prog=[[48,60,64,67],[53,60,65,69],[55,59,62,67],[48,60,64,67]];
    seq(v,e,(s,tt)=>{const c=prog[Math.floor(s/8)%4], i=s%8;
      if(i%4===0) kick(v,tt,.6); if(i%4===2) clap(v,tt); nb(v,tt,{type:'highpass',f:8000,d:.03,peak:.06});
      bass(v,c[0]-12+(i%2?12:0),tt,e*.8,.3);
      if([1,3,6].includes(i)) c.slice(1).forEach(m=>brass(v,m+12,tt,e*.6,.07));
    },t); return null;
  },
  villain(v,t){[36,42,48,51,54,60].forEach(m=>brass(v,m,t,2.2,.12)); [36,48].forEach(m=>organ(v,m,t,2.4,.25)); timp(v,t,42,1); nb(v,t,{type:'lowpass',f:200,d:2,peak:.5}); return 4.5;},
  chase(v,t){return runLoop(v,t,false);},
  bouncy(v,t){return runLoop(v,t,true);},
  prayer(v,t){padLoop(v,t,[[57,64,69,72],[53,60,65,69],[48,55,64,67],[55,62,67,71]],4.5,{vel:.045,keys:true,opts:{type:'triangle',cut:1500,a:1.8,r:2}}); return null;},
  chime(v,t){[84,88,91,96,100].forEach((m,i)=>bell(v,m,t+i*.11,.12,3)); nb(v,t,{type:'highpass',f:7000,a:.4,d:2,peak:.05}); return 4;},
  mafia(v,t){
    const b=60/84, prog=[[36,[60,63,67]],[41,[60,65,68]],[43,[59,62,65]],[36,[60,63,67]]];
    const mel=[[[72,2],[75,1]],[[77,1],[75,1],[72,1]],[[71,2],[74,1]],[[72,3]]];
    seq(v,b,(s,tt)=>{const bar=Math.floor(s/3)%4, beat=s%3, [bn,ch]=prog[bar];
      if(beat===0) bass(v,bn,tt,b*.9,.4); else ch.forEach(m=>piano(v,m,tt,.25,.1));
      if(Math.floor(s/12)%2===1){let pos=0; mel[bar].forEach(([m,len])=>{if(pos===beat) for(let x=0;x<len*b*.95;x+=.065) piano(v,m,tt+x,.12,.13); pos+=len;});}
    },t); return null;
  },
  ogre(v,t){
    const o=O('sawtooth',70,t,t+2.2); o.frequency.linearRampToValueAtTime(100,t+.3); o.frequency.exponentialRampToValueAtTime(50,t+1.9);
    const am=G(.6), l=O('sine',32,t,t+2.2); l.connect(G(.4)).connect(am.gain);
    const ws=ctx.createWaveShaper(); ws.curve=distCurve(40); const g=G(0); ahr(g,t,.12,1.2,.7,.45);
    o.connect(am).connect(ws).connect(F('lowpass',1100,1.5)).connect(g).connect(v.out);
    const gn=G(0); ahr(gn,t,.1,1.2,.7,.7); chain(noise(v,t,2.2),F('bandpass',500,1.5),gn,v.out); return 2.6;
  },
  fanfare(v,t){
    const tr=.13, hit=3*tr+.8;
    [[67,0],[67,tr],[67,2*tr],[72,3*tr,.5],[76,3*tr+.55,.2],[79,hit,1.4]].forEach(([m,dt,d=.11])=>brass(v,m,t+dt,d,.2));
    [60,64,67,72].forEach(m=>brass(v,m,t+hit,1.4,.1)); timp(v,t+hit,55,.7); nb(v,t+hit,{type:'highpass',f:5000,a:.005,d:1.8,peak:.2}); return 3.5;
  },
  dun(v,t){[[55,0,.22],[55,.38,.22],[51,.76,2.2]].forEach(([m,dt,d])=>{[m-24,m-12,m].forEach(x=>brass(v,x,t+dt,d,.16)); timp(v,t+dt,m2f(m-24),.8);}); return 4;},
  scuffle(v,t){
    for(let i=0;i<16;i++){const tt=t+Math.random()*2.6, r=Math.random();
      if(r<.4){const o=O('sine',100+Math.random()*60,tt,tt+.25); o.frequency.exponentialRampToValueAtTime(50,tt+.15); const g=G(0); perc(g,tt,.002,.18,.7); o.connect(g).connect(v.out); nb(v,tt,{type:'lowpass',f:600,d:.08,peak:.5});}
      else if(r<.8) nb(v,tt,{f:1800+Math.random()*1500,q:.8,a:.02,d:.15,peak:.25});
      else nb(v,tt,{type:'highpass',f:1500,a:.001,d:.05,peak:.8});
    } return 3.2;
  },
  cheer(v,t){
    const out=G(0); ahr(out,t,.6,2,2.2,1); out.connect(v.out);
    [[600,1],[1100,1],[1800,.7],[2600,.5],[3400,.3]].forEach(([f,a])=>{const am=G(a), l=O('sine',2+Math.random()*4,t,t+5.2); l.connect(G(a*.4)).connect(am.gain); chain(noise(v,t,5.2),F('bandpass',f,2.5),am,out);});
    for(let i=0;i<70;i++) nb(v,t+.3+Math.random()*3.5,{f:1200+Math.random()*800,q:1.2,d:.04,peak:.12+Math.random()*.15});
    [.8,1.9].forEach(dt=>{const tt=t+dt, o=O('sine',1700,tt,tt+.7); o.frequency.linearRampToValueAtTime(2600,tt+.25); o.frequency.linearRampToValueAtTime(1500,tt+.65); const g=G(0); ahr(g,tt,.03,.5,.1,.06); o.connect(g).connect(v.out);});
    return 5.5;
  },
  court(v,t){
    [0,.6].forEach(dt=>{const tt=t+dt; timp(v,tt,44,1,1.8); nb(v,tt,{f:1800,q:3,a:.002,d:.7,peak:.35});
      [.5,.72,1.13].forEach(r=>{const o=O('square',220*r*(dt?.94:1),tt,tt+1), g=G(0); perc(g,tt,.002,.8,.06); o.connect(F('lowpass',1500)).connect(g).connect(v.out);});});
    return 3.2;
  },
  underscore(v,t){
    [38,45,50].forEach((m,i)=>{const g=G(0); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(i?.035:.06,t+3); const lp=F('lowpass',i?900:350,1);
      [-5,5].forEach(d=>{const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=m2f(m); o.detune.value=d; o.start(t); v.keep(o); o.connect(lp);}); lp.connect(g).connect(v.out);});
    seq(v,1.6,(s,tt)=>{timp(v,tt,48,.35,.6); timp(v,tt+.28,46,.22,.6);},t+1); return null;
  },
  gavel(v,t){[0,.32,.64].forEach(dt=>{const tt=t+dt, o=O('sine',320,tt,tt+.15); o.frequency.exponentialRampToValueAtTime(180,tt+.08); const g=G(0); perc(g,tt,.001,.1,.8); o.connect(g).connect(v.out); nb(v,tt,{f:1600,q:2,a:.001,d:.04,peak:.9}); nb(v,tt,{type:'lowpass',f:250,d:.12,peak:.6});}); return 1.6;},
  riser(v,t){
    const bp=F('bandpass',200,1.5,t); bp.frequency.exponentialRampToValueAtTime(7000,t+5);
    const g=G(0); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.7,t+5); g.gain.setValueAtTime(0,t+5.05); chain(noise(v,t,5.4),bp,g,v.out);
    const lp=F('lowpass',600,1,t); lp.frequency.exponentialRampToValueAtTime(3500,t+5);
    const gs=G(0); gs.gain.setValueAtTime(.0001,t); gs.gain.exponentialRampToValueAtTime(.25,t+5); gs.gain.setValueAtTime(0,t+5.05); lp.connect(gs).connect(v.out);
    [50,51,56,57].forEach(m=>{const o=O('sawtooth',m2f(m),t,t+5.1); o.detune.linearRampToValueAtTime(400,t+5); o.connect(lp);});
    let tt=t, iv=.8; while(tt<t+5){timp(v,tt,50,.4,.4); tt+=iv; iv=Math.max(.22,iv*.85);}
    timp(v,t+5.05,40,1,2); nb(v,t+5.05,{type:'lowpass',f:300,d:1.5,peak:.6}); return 7;
  },
};
function flash(v,t,up){
  const ns=[]; for(let o=0;o<3;o++) [0,2,4,7,9].forEach(s=>ns.push(60+o*12+s)); ns.push(96); if(!up) ns.reverse();
  ns.forEach((m,i)=>piano(v,m,t+i*.065,1.6,.12));
  const bp=F('bandpass',up?2000:6000,.8,t); bp.frequency.exponentialRampToValueAtTime(up?8000:1500,t+1.2);
  const g=G(0); ahr(g,t,.6,.2,1.2,.08); chain(noise(v,t,2.2),bp,g,v.out); return 3;
}
function runLoop(v,t,major){
  const e=60/(major?150:168)/2;
  const r1=major?[72,74,76,77,79,77,76,74]:[72,71,70,69,68,67,66,65], r2=major?[67,69,71,72,74,72,71,67]:[60,62,63,65,67,68,70,71];
  seq(v,e,(s,tt)=>{const bar=Math.floor(s/8)%4, i=s%8; piano(v,(bar%2?r2:r1)[i],tt,.14,.14);
    if(i%2===0) bass(v,[48,43][(i/2)%2],tt,e*.7,.35); else nb(v,tt,{f:1800,q:.8,d:.06,peak:.25});
    if(major&&i===0&&bar===3){const o=O('sine',120,tt,tt+.4); o.frequency.exponentialRampToValueAtTime(420,tt+.3); const g=G(0); perc(g,tt,.005,.35,.25); o.connect(g).connect(v.out);}
  },t); return null;
}

/* =========================================================
   VOICES / PLAYBACK
   ========================================================= */
const active=new Map();
class Voice{
  constructor(cue,vol){
    this.cue=cue; this.out=G(vol); this.out.connect(master);
    this.rev=G(cue.rev??.25); this.out.connect(this.rev); this.rev.connect(reverb);
    this.kept=[]; this.timers=[]; this.dead=false; this.stopping=false;
  }
  keep(n){this.kept.push(n); return n;}
  timer(id){this.timers.push(id);}
  clear(){this.timers.forEach(i=>{clearTimeout(i);clearInterval(i);}); this.timers=[];}
  stop(f=.5){
    if(this.stopping||this.dead) return; this.stopping=true;
    const t=ctx.currentTime, g=this.out.gain; g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.linearRampToValueAtTime(0,t+f);
    this.clear(); setTimeout(()=>this.end(),f*1000+80); render();
  }
  end(){
    if(this.dead) return; this.dead=true; this.clear();
    this.kept.forEach(n=>{try{n.stop();}catch(e){}});
    try{this.out.disconnect(); this.rev.disconnect();}catch(e){}
    this.onEnd&&this.onEnd();
  }
}
function cueVol(id){const c=byId[id]; return (c.lvl??.85)*(settings.cues[id]?.vol??1);}
function cueLoops(id){const s=settings.cues[id]; return s&&s.loop!=null? s.loop : !!byId[id].loop;}
function play(id,{seq=null}={}){
  initAudio(); if(ctx.state!=='running') ctx.resume();
  const cue=byId[id];
  const stops=cue.stops==='all'? [...active.keys()] : (cue.stops||[]);
  stops.forEach(s=>{if(s!==id&&active.has(s)) active.get(s).stop(cue.hard?.04:.7);});
  if(active.has(id)) active.get(id).stop(.05);
  const v=new Voice(cue,cueVol(id)); active.set(id,v);
  const t=ctx.currentTime+.03; let dur;
  const f=files[id];
  if(f&&f.buffer){
    const s=ctx.createBufferSource(); s.buffer=f.buffer; s.loop=cueLoops(id); s.connect(v.out); s.start(t); v.keep(s);
    v.rev.gain.value=0; dur=s.loop?null:f.buffer.duration;
  } else {
    dur=SYN[cue.syn](v,t,cue.arg);
  }
  v.t0=t; v.dur=dur;
  if(dur!=null) v.timer(setTimeout(()=>v.end(),(dur+.4)*1000));
  v.onEnd=()=>{if(active.get(id)===v) active.delete(id); render();};
  (cue.then||[]).forEach(([nid,d])=>setTimeout(()=>play(nid),d*1000));
  v.seq=seq; if(seq!=null) setStandby(seq+1); else render();
}
function toggle(id,seq=null){
  const v=active.get(id);
  if(v&&!v.stopping&&(seq==null||v.seq===seq)) v.stop(.5); else play(id,{seq});
}
function fadeAll(f=1.5){active.forEach(v=>v.stop(f));}
function go(){
  if(standby>=SEQ.length) return; const i=standby, id=SEQ[i], v=active.get(id);
  if(v&&!v.stopping&&byId[id].loop){v.seq=i; setStandby(i+1); return;} // bed already running: keep it going
  play(id,{seq:i});
}

let settings={master:.9,follow:true,cues:{}};
try{Object.assign(settings,JSON.parse(localStorage.getItem('cays-sb-settings')||'{}'));}catch(e){}
function saveSettings(){try{localStorage.setItem('cays-sb-settings',JSON.stringify(settings));}catch(e){}}
const files={}; // id -> {name, buffer, src}
const idb={
  db:null,
  open(){ if(this.db) return Promise.resolve(this.db);
    return new Promise((res,rej)=>{const r=indexedDB.open('cays-soundboard',1); r.onupgradeneeded=()=>r.result.createObjectStore('files'); r.onsuccess=()=>{this.db=r.result;res(r.result);}; r.onerror=()=>rej(r.error);}); },
  async tx(mode,fn){const db=await this.open(); return new Promise((res,rej)=>{const t=db.transaction('files',mode), s=t.objectStore('files'); const r=fn(s); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error);});},
  put(k,v){return this.tx('readwrite',s=>s.put(v,k));},
  del(k){return this.tx('readwrite',s=>s.delete(k));},
  async all(){const db=await this.open(); return new Promise((res,rej)=>{const out={}; const t=db.transaction('files'); const c=t.objectStore('files').openCursor(); c.onsuccess=()=>{const cur=c.result; if(cur){out[cur.key]=cur.value; cur.continue();}}; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error);});}
};
async function decode(blob){initAudio(); const ab=await blob.arrayBuffer(); return await new Promise((res,rej)=>ctx.decodeAudioData(ab,res,rej));}
async function loadFileFor(id,file){
  try{
    const buffer=await decode(file);
    files[id]={name:file.name,buffer,src:'local'};
    try{await idb.put(id,{name:file.name,blob:file});}catch(e){}
    render();
  }catch(e){alert('Could not read "'+file.name+'" as audio. Try an MP3, WAV or M4A.');}
}
async function resetFile(id){delete files[id]; try{await idb.del(id);}catch(e){} await loadServerFile(id); render();}
let manifest={};
async function loadServerFile(id){
  const fn=manifest[id]; if(!fn) return;
  try{const r=await fetch('sounds/'+fn); if(!r.ok) return; const buffer=await decode(await r.blob()); if(!files[id]) files[id]={name:fn,buffer,src:'site'};}catch(e){}
}
async function loadAllFiles(){
  try{const r=await fetch('sounds/manifest.json',{cache:'no-cache'}); if(r.ok) manifest=await r.json();}catch(e){}
  try{const saved=await idb.all(); for(const [id,rec] of Object.entries(saved)){ if(!byId[id]) continue; try{files[id]={name:rec.name,buffer:await decode(rec.blob),src:'local'};}catch(e){} }}catch(e){}
  await Promise.all(Object.keys(manifest).filter(id=>byId[id]&&!files[id]).map(loadServerFile));
  render();
}

let standby=0; const SEQ=[...SCRIPT.matchAll(/\{\{(\w+)\}\}/g)].map(x=>x[1]).filter(id=>ENABLED.includes(id));
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let chipN=0;
function chipHTML(id){const c=byId[id]; if(!c||!ENABLED.includes(id)) return ''; return `<button class="cue-chip${c.big?' big':''}" data-cue="${id}" data-seq="${chipN++}" title="${esc(c.tip||c.name)}"><span class="n">${id}</span>${esc(c.name)}</button>`;}
function buildScript(){
  const el=document.getElementById('script');
  let h='<div class="sc-title">The Case of the Beautiful Gate</div><p class="sc-sub">A mystery/crime comedy based on Acts 2–4 · click any cue to fire it</p>';
  SCRIPT.trim().split('\n').forEach(raw=>{
    const line=raw.trim(); if(!line) return;
    const withCues=s=>esc(s).replace(/\{\{(\w+)\}\}/g,(_,id)=>chipHTML(id));
    if(line.startsWith('## ')) h+=`<div class="act">${esc(line.slice(3))}</div>`;
    else if(line.startsWith('[')) h+=`<p class="stage">${withCues(line)}</p>`;
    else { const m=line.match(/^([A-Z][A-Za-z0-9 ]{0,30}):\s*(.*)$/);
      if(m) h+=`<p class="line"><span class="who">${esc(m[1])}</span>${withCues(m[2]).replace(/\[([^\]]*)\]/g,'<i style="color:var(--mute)">[$1]</i>')}</p>`;
      else h+=`<p class="stage">${withCues(line)}</p>`; }
  });
  el.innerHTML=h;
}
function buildBoard(){
  const el=document.getElementById('board'); let h='', act=0;
  CUES.filter(c=>ENABLED.includes(c.id)).forEach(c=>{
    if(c.act!==act){ if(act) h+='</div>'; act=c.act; h+=`<div class="grp">${ACTS[act]}</div><div class="grid">`; }
    h+=`<div class="tile${c.big?' big':''}" data-tile="${c.id}">
      <button class="tplay" data-cue="${c.id}"><span class="num">${c.id}</span><span class="nm">${esc(c.name)}</span><span class="meta"></span></button>
      <button class="tmore" data-more="${c.id}" title="Settings">⋯</button>
      <div class="tvol">${volCtl(c.id)}</div>
      <div class="prog"></div>
      <div class="tset">
        ${c.tip?`<div class="tip">${esc(c.tip)}</div>`:''}
        <div class="row"><label><input type="checkbox" data-loop="${c.id}" ${cueLoops(c.id)?'checked':''}> Loop</label></div>
        <div class="row"><button class="btn" data-load="${c.id}">Load sound…</button><button class="btn" data-reset="${c.id}">Use placeholder</button></div>
      </div></div>`;
  });
  h+='</div><p class="boardnote">Only the big ambience cues are on for now; the rest are held in reserve. Every cue starts with a placeholder sound generated in your browser. To use a real sound, drag an audio file onto a tile, or open ⋯ and choose <b>Load sound</b>. Sounds you load are saved in this browser on this device.</p>';
  el.innerHTML=h;
}
function pct(x){return Math.round(x*100)+'%';}
function volCtl(id){const x=settings.cues[id]?.vol??1; return `<input type="range" min="0" max="2" step="0.01" data-vol="${id}" value="${x}" title="Volume for cue ${id}"><span class="vv${x!==1?' off':''}" data-vv="${id}" title="Double-click to reset to 100%">${pct(x)}</span>`;}
function setCueVol(id,x){
  (settings.cues[id]=settings.cues[id]||{}).vol=x; saveSettings();
  document.querySelectorAll(`[data-vol="${id}"]`).forEach(r=>{if(+r.value!==x) r.value=x;});
  document.querySelectorAll(`[data-vv="${id}"]`).forEach(t=>{t.textContent=pct(x); t.classList.toggle('off',x!==1);});
  const v=active.get(id); if(v&&!v.stopping) v.out.gain.setTargetAtTime(cueVol(id),ctx.currentTime,.05);
}
function setMaster(x){
  settings.master=Math.max(0,Math.min(1.5,x)); saveSettings();
  mv.value=settings.master; document.getElementById('masterv').textContent=pct(settings.master);
  if(master) master.gain.setTargetAtTime(settings.master,ctx.currentTime,.03);
}
function setStandby(i){standby=Math.max(0,Math.min(SEQ.length,i)); render(); if(settings.follow) followStandby();}
function followStandby(){
  const c=byId[SEQ[standby]]; if(!c) return;
  const chip=document.querySelector(`#script .cue-chip[data-seq="${standby}"]`); chip&&chip.scrollIntoView({block:'center',behavior:'smooth'});
  const tile=document.querySelector(`[data-tile="${c.id}"]`); tile&&tile.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function render(){
  const sb=byId[SEQ[standby]];
  document.getElementById('sbWhat').textContent= sb? `${sb.id} · ${sb.name}` : 'End of cue list';
  document.querySelectorAll('[data-cue]').forEach(b=>{
    const id=b.dataset.cue, v=active.get(id);
    const el=b.classList.contains('tplay')? b.parentElement : b;
    const isChip=b.dataset.seq!=null, sq=isChip?+b.dataset.seq:null;
    el.classList.toggle('playing',!!v&&!v.stopping&&(!isChip||v.seq==null||v.seq===sq));
    el.classList.toggle('standby',isChip? sq===standby : (!!sb&&sb.id===id));
  });
  document.querySelectorAll('[data-tile]').forEach(t=>{
    const id=t.dataset.tile, c=byId[id], f=files[id];
    t.querySelector('.meta').innerHTML=(cueLoops(id)?'loop':'one-shot')+' · '+(f?`<span class="file">${esc(f.name)}</span>`:(c.slot?'placeholder: add a file':'placeholder'));
  });
  const now=document.getElementById('now');
  if(!active.size) now.innerHTML='<span class="empty">Nothing playing</span>';
  else now.innerHTML=[...active.entries()].map(([id,v])=>`<span class="chip"><b>${id}</b> ${esc(byId[id].name)} <span class="t" data-t="${id}"></span>${volCtl(id)}<button data-fade="${id}">fade</button><button data-stop="${id}">stop</button></span>`).join('');
  tickUI(); fitLayout();
}
function fmt(s){s=Math.max(0,s); return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');}
let raf=0;
function tickUI(){
  cancelAnimationFrame(raf);
  document.querySelectorAll('[data-tile] .prog').forEach(p=>p.style.width='0');
  if(!active.size) return;
  const now=ctx.currentTime;
  active.forEach((v,id)=>{
    const el=v.t0!=null? now-v.t0 : 0;
    const t=document.querySelector(`[data-t="${id}"]`); if(t) t.textContent=fmt(el)+(v.dur?(' / '+fmt(v.dur)):'');
    const p=document.querySelector(`[data-tile="${id}"] .prog`); if(p) p.style.width= v.dur? Math.min(100,el/v.dur*100)+'%' : '100%';
  });
  raf=requestAnimationFrame(tickUI);
}
function fitLayout(){const r=document.documentElement.style; r.setProperty('--hdr',document.getElementById('hdr').offsetHeight+'px'); r.setProperty('--nowh',document.getElementById('now').offsetHeight+'px');}

/* --- events --- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.cue){toggle(b.dataset.cue, b.dataset.seq!=null? +b.dataset.seq : null); return;}
  if(b.dataset.more){b.closest('.tile').classList.toggle('open'); return;}
  if(b.dataset.load){pickTarget=b.dataset.load; document.getElementById('filepick').click(); return;}
  if(b.dataset.reset){resetFile(b.dataset.reset); return;}
  if(b.dataset.fade){active.get(b.dataset.fade)?.stop(1.5); return;}
  if(b.dataset.stop){active.get(b.dataset.stop)?.stop(.05); return;}
});
document.addEventListener('input',e=>{const id=e.target.dataset.vol; if(id) setCueVol(id,+e.target.value);});
document.addEventListener('dblclick',e=>{
  const t=e.target.closest('[data-vv]'); if(t){setCueVol(t.dataset.vv,1); return;}
  if(e.target.id==='masterv') setMaster(.9);
});
document.getElementById('resetvols').onclick=()=>{CUES.forEach(c=>{if(settings.cues[c.id]?.vol!=null) setCueVol(c.id,1);});};
document.addEventListener('change',e=>{
  const id=e.target.dataset.loop; if(!id) return;
  (settings.cues[id]=settings.cues[id]||{}).loop=e.target.checked; saveSettings(); render();
});
let pickTarget=null;
document.getElementById('filepick').addEventListener('change',e=>{const f=e.target.files[0]; if(f&&pickTarget) loadFileFor(pickTarget,f); e.target.value='';});
document.addEventListener('dragover',e=>{const t=e.target.closest('[data-tile]'); if(t){e.preventDefault(); t.classList.add('drag');}});
document.addEventListener('dragleave',e=>{const t=e.target.closest('[data-tile]'); if(t) t.classList.remove('drag');});
document.addEventListener('drop',e=>{const t=e.target.closest('[data-tile]'); if(!t) return; e.preventDefault(); t.classList.remove('drag'); const f=e.dataTransfer.files[0]; if(f) loadFileFor(t.dataset.tile,f);});
document.getElementById('go').onclick=go;
document.getElementById('fade').onclick=()=>fadeAll(1.5);
document.getElementById('panic').onclick=()=>fadeAll(.03);
const mv=document.getElementById('master'); mv.value=settings.master;
mv.oninput=()=>setMaster(+mv.value); document.getElementById('masterv').textContent=pct(settings.master);
const fw=document.getElementById('follow'); fw.checked=settings.follow; fw.onchange=()=>{settings.follow=fw.checked; saveSettings();};
document.getElementById('viewtoggle').onclick=e=>{const on=document.body.classList.toggle('show-board'); e.target.textContent=on?'Show script':'Show board';};
document.addEventListener('keydown',e=>{
  if(e.target.matches('input[type=text],textarea')) return;
  if(e.code==='Space'){e.preventDefault(); go();}
  else if(e.key==='Escape'){e.preventDefault(); fadeAll(e.shiftKey?.03:1.5);}
  else if(e.key==='ArrowDown'){e.preventDefault(); setStandby(standby+1);}
  else if(e.key==='ArrowUp'){e.preventDefault(); setStandby(standby-1);}
  else if(e.key==='-'||e.key==='_'){setMaster(settings.master-.05);}
  else if(e.key==='='||e.key==='+'){setMaster(settings.master+.05);}
});
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{initAudio(); if(ctx.state!=='running') ctx.resume();},{once:false,passive:true}));
window.addEventListener('resize',fitLayout);

/* --- offline render (used for testing levels) --- */
window.__renderCue=async(id,secs=6)=>{
  const saved={ctx,master,comp,reverb,NOISE}; OFFLINE=true;
  const oc=new OfflineAudioContext(2,Math.floor(44100*secs),44100); buildGraph(oc);
  const cue=byId[id], v=new Voice(cue,cueVol(id)); SYN[cue.syn](v,.05,cue.arg);
  const buf=await oc.startRendering(); OFFLINE=false; ({ctx,master,comp,reverb,NOISE}=saved);
  let peak=0,sum=0; const d=buf.getChannelData(0); for(let i=0;i<d.length;i++){const x=Math.abs(d[i]); if(x>peak) peak=x; sum+=x*x;}
  return {id,peak:+peak.toFixed(3),rms:+Math.sqrt(sum/d.length).toFixed(4)};
};

buildScript(); buildBoard(); fitLayout(); render(); initAudio(); loadAllFiles();
</script>
</body>
